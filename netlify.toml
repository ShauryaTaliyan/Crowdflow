[build]
  publish = "dist"
  command = "npm run build"

# SPA Fallback so page reloads do not 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers for production
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
